name: Daily VN swing brief

# Bản tin swing hằng ngày: pipeline ML + hội đồng 5 tác nhân -> DAILY_DIGEST.md, commit vào repo.
# KHÔNG PHẢI KHUYẾN NGHỊ ĐẦU TƯ.

on:
  schedule:
    # 01:30 UTC = 08:30 giờ VN (UTC+7), T2–T6 (trước giờ ATO 09:00). Cron GitHub theo UTC & có thể trễ.
    - cron: "30 1 * * 1-5"
  workflow_dispatch: {}   # cho phép chạy tay từ tab Actions

permissions:
  contents: write         # để commit/push kết quả

concurrency:
  group: daily-swing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}   # tuỳ chọn: đặt biến repo CLAUDE_MODEL để chọn model rẻ hơn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Setup Node (cho Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache data_cache (giá lịch sử vnstock)
        uses: actions/cache@v4
        with:
          path: analysis/data_cache
          key: datacache-${{ github.run_id }}
          restore-keys: |
            datacache-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt
          npm install -g @anthropic-ai/claude-code
          claude --version || true

      - name: Run daily workflow (pipeline + debate + digest)
        run: bash analysis/scripts/run_daily_ci.sh

      - name: Commit & push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/results analysis/daily
          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit (có thể pipeline chưa có dữ liệu phiên mới)."
            exit 0
          fi
          DATE="$(date -u +%Y-%m-%d)"
          git commit -m "daily-swing: bản tin ${DATE} [skip ci]" \
                     -m "Tự động sinh bởi .github/workflows/daily-swing.yml. KHÔNG PHẢI KHUYẾN NGHỊ ĐẦU TƯ."
          git push

      - name: Upload artifacts (phòng khi push lỗi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief
          path: |
            analysis/daily/**
            analysis/results/DAILY_DIGEST.md
            analysis/results/debate/**
          if-no-files-found: ignore
          retention-days: 14
